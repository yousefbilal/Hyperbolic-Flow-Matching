# @package _global_
# CIFAR-LT Euclidean baseline (HAECifar with curvature=0).
data: euclidean_images
use_wandb: True

# Override on CLI:
#   images_datadir=/path/to/z_hyp.pt images_labels=/path/to/labels.pt

num_classes: 10
fm_conditioning: none
cfg_label_dropout: 0.1
cfg_cond_dim: 64

model:
  d_model: 512
  num_layers: 5
  actfn: swish
  fourier: null
  atol: 1e-6
  rtol: 1e-6
  metric_normalize: False   # Euclidean: no metric-normalised vecfield

optim:
  num_iterations: 100000
  batch_size: 128
  val_batch_size: 2000
  lr: 1e-4

val_every: 1000
div_mode: rademacher
eval_projx: False
local_coords: False
normalize_loglik: False
visualize: False
