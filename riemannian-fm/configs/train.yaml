defaults:
  - _self_
  - experiment: null
  - override hydra/launcher: submitit_slurm
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

data: euclidean  # {volcano,earthquake,fire,flood}
earth_datadir: /checkpoint/${oc.env:USER,unknown}/data/earth_data
rna_datadir: /checkpoint/${oc.env:USER,unknown}/data/rna
top500_datadir: /checkpoint/${oc.env:USER,unknown}/data/top500
mesh_datadir: /checkpoint/${oc.env:USER,unknown}/data/mesh
data_seed: null  # seed for creating the data splits. By default, uses global seed.
#euclidean_datadir: /home/fvaleau/HAE/proj/umap_flowers/euc_embed_tv
euclidean_datadir: /home/fvaleau/HAE/proj/animals_emb_1/euc_embed_flat
images_datadir: /home/fvaleau/HAE/proj/animals_emb_5/embed
#images_datadir: /home/fvaleau/HAE/proj/flowers_emb_10/embed
images_labels: /home/fvaleau/HAE/proj/umap_flowers/labels
images_datadir_A: /home/fvaleau/HAE/proj/selected_embeddings/100
images_datadir_B: /home/fvaleau/HAE/proj/selected_embeddings/102

# Long-tail handling for the RFM trainer (CIFAR-LT, ImageNet-LT). Both knobs
# are independent of the HAE side and act on the embedding-level training of
# the vector field.
rfm_sampler: instance        # {instance, balanced, sqrt}
rfm_class_weighting: none    # {none, inv_freq, effective_number}
rfm_eff_num_beta: 0.9999     # only used when rfm_class_weighting=effective_number
rfm_class_counts: null       # populated automatically by train.py from the labels file

# Only used for sampling from wrapped distributions.
wrapped:
  dim: 5
  n_mixtures: 1
  scale: 0.2

mesh:
  # Parameters for defining distance on discrete mesh.
  numeigs: 100
  metric: biharmonic  # {diffusion, biharmonic, commutetime}
  temp: 0.25
  nsteps: 200  # number of steps for solving the path
  time_eps: 1e-5
  projx: True
  method: euler
  atol: 1e-5
  rtol: 1e-5

model:
  d_model: 512
  num_layers: 8
  actfn: swish
  fourier: null
  atol: 1e-7
  rtol: 1e-7
  metric_normalize: False

optim:
  num_iterations: 1000000
  batch_size: 1024
  val_batch_size: 20000

  scheduler: cosine
  grad_clip: 0.0
  lr: 1e-4
  wd: 0.0
  eps: 1e-8
  ema_decay: 0.999

div_mode: exact
normalize_loglik: False
early_stopping_patience: 200  # this is affected by val_every

use_wandb: True

resume: null

seed: 0

val_every: 1000
ckpt_every: null
visualize: False

eval_projx: True
local_coords: False

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/runs/${data}/fm/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: ./outputs/multiruns/${data}/fm/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    timeout_min: 4319
    cpus_per_task: 10
    gpus_per_node: 1
    nodes: 1
    partition: gpu_h100
    gres: gpu:h100:1
    constraint: null
